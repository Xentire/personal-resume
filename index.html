<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="description" content="后端工程师个人作品集" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0E14'/%3E%3Cpath d='M9 11l7 5-7 5' fill='none' stroke='%234C8DFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 21h6' stroke='%234C8DFF' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Portfolio</title>
    <script>
      // 在 CSS/React 之前把保存的配色写到 <html> 上，避免首屏先闪一下默认色
      (function () {
        var theme = 'paper';
        try {
          var saved = localStorage.getItem('portfolio-theme');
          if (saved && /^[a-z]{3,16}$/.test(saved)) theme = saved;
        } catch (error) {
          /* 隐私模式下读不到 localStorage，用默认配色 */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
